name: Generate and Publish Documentation

on:
  push:
    branches: [ "main", "master" ]

# Надаємо права для публікації на GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    # ОСЬ ГОЛОВНЕ ВИПРАВЛЕННЯ: Замовляємо сервер на Windows!
    runs-on: windows-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Оновлено до v4 (виправляє попередження)

    - name: Setup .NET
      uses: actions/setup-dotnet@v4 # Оновлено до v4 (виправляє попередження)
      with:
        dotnet-version: '8.0.x'

    - name: Install DocFX
      run: dotnet tool install -g docfx

    - name: Build Documentation
      run: docfx docfx.json

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '_site'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4